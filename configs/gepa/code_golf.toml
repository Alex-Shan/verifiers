# export OPENROUTER_API_KEY
# 用法: uv run vf-gepa @ configs/gepa/code_golf.toml

num_train = 2
num_val = 1
reflection_minibatch_size = 2
# gr_gepa = true
# group_size = 4
# group_alpha = 0.5
seed = 42
# max_total_rollouts = 100
# To stop by iterations instead, replace max_total_rollouts with one of:
max_iterations = 10
# max_iterations_without_improvement = 5
max_concurrent = 256
clean = true
use_wandb = false
# dry_run = true
# push = false
output_dir = "outputs/gepa"

model = "qwen/qwen3-30b-a3b-instruct-2507"
reflection_model = "deepseek/deepseek-v4-flash-0731"

[select]
shuffle = true
seed = 42

# ---------- 模型客户端 ----------
[client]
# base_url = "http://localhost:8000/v1"
# api_key_var = "VLLM_API_KEY"

base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[reflection_client]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"



[env.taskset]
id = "code-golf"

[env.golfer.harness]
id = "bash"
[env.golfer.runtime]
type = "docker"
image = "alexshan2docker/harness-env:v0.0.1"
